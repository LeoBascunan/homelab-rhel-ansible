---
# Order matters: packages first (chrony/firewalld must exist before they are configured),
# users and SSH before hardening (never lock yourself out), firewalld last.

- name: Install base packages
  ansible.builtin.dnf:
    name: "{{ base_packages }}"
    state: present

- name: Set the timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Configure chrony
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart chrony

- name: Enable and start chrony
  ansible.builtin.service:
    name: chronyd
    state: started
    enabled: true

