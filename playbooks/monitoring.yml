---
- name: Node exporter on every node
  hosts: all
  become: true
  roles:
    - prometheus.prometheus.node_exporter
  post_tasks:
    - name: Open the node exporter port
      ansible.posix.firewalld:
        port: 9100/tcp
        permanent: true
        immediate: true
        state: enabled

- name: Prometheus and Grafana on the monitoring server
  hosts: monitoring
  become: true
  vars:
    prometheus_web_listen_address: "0.0.0.0:9095"
    prometheus_scrape_configs:
      - job_name: node
        static_configs:
          - targets:
              - 192.168.52.11:9100
              - 192.168.52.12:9100
    grafana_rhsm_subscription: false
    grafana_rhsm_repo: false
    grafana_ini:
      security:
        admin_user: admin
        admin_password: "{{ vault_grafana_admin_password }}"
  roles:
    - prometheus.prometheus.prometheus
    - grafana.grafana.grafana
  post_tasks:
    - name: Open Prometheus and Grafana ports
      ansible.posix.firewalld:
        port: "{{ item }}"
        permanent: true
        immediate: true
        state: enabled
      loop:
        - 9095/tcp
        - 3000/tcp
